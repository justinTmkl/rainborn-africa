<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kefalonia Summer — slide types</title>
<style>
:root{
  --sea-abyss:#06384B;--sea-deep:#0B5673;--sea-mid:#1187A8;--sea-lagoon:#35B8C4;
  --sea-myrtos:#6FD9DC;--sea-foam:#C7EFEC;--whitewash:#FDFBF6;--limestone:#F4ECDD;
  --sand:#E7D6B8;--olive:#7E8F4E;--olive-deep:#4E6039;--sun:#F6C049;--sun-glow:#FFE29A;
  --apricot:#F2914C;--terracotta:#C05A38;--bougainvillea:#D8456E;--mavrodaphne:#6E2438;
  --ink:#12303B;--ink-soft:#3E5A66;--ink-mute:#6E858F;
  --display:'Cormorant Garamond',Palatino,'Book Antiqua',Georgia,serif;
  --sans:'DM Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  --script:'Caveat','Bradley Hand','Segoe Script',cursive;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --scrim:linear-gradient(0deg,rgba(6,56,75,.74) 0%,rgba(6,56,75,.34) 34%,rgba(6,56,75,.04) 66%,rgba(6,56,75,0) 100%);
}
*{box-sizing:border-box}
body{margin:0;padding:56px 64px;background:var(--whitewash);font-family:var(--sans);color:var(--ink-soft)}
.eyebrow{font-size:14px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--sea-mid);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:56px;line-height:1;margin:8px 0 10px;color:var(--ink)}
.lede{font-size:19px;line-height:1.5;max-width:66ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 28px;margin-top:44px}
figure{margin:0}
.thumb{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 10px 26px rgba(18,48,59,.14);background:var(--whitewash);font-size:9px;line-height:1.25}
figcaption{margin-top:12px}
figcaption b{display:block;font-family:var(--display);font-size:23px;font-weight:500;color:var(--ink)}
figcaption span{display:block;font-size:14px;line-height:1.45;color:var(--ink-mute);margin-top:3px}
figcaption code{font-family:var(--mono);font-size:12px;color:var(--sea-mid)}

/* Scene stand-ins, same construction as the deck's CSS photographs. */
.sc{position:absolute;inset:0}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#96DFF0,#EFF9F4 96%)}
.sea{position:absolute;inset:46% 0 0 0;background:linear-gradient(180deg,#7FE4E4,#0C6C90)}
.sea--sunset{background:linear-gradient(180deg,#E39070,#2B3E62)}
.sky--sunset{background:linear-gradient(180deg,#FFD27A,#FFAF7C)}
.hill{position:absolute;bottom:0;width:26%;height:62%;
  background:linear-gradient(180deg,#93A96E,#E6DCC2 60%);border-radius:60% 60% 0 0/86% 86% 0 0}
.hill--l{left:-4%}
.hill--r{right:-4%;background:linear-gradient(180deg,#6E8047,#D5C7A6 60%)}
.sun{position:absolute;right:18%;top:10%;width:22%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,243,214,.95),rgba(255,226,154,0) 68%)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.t-title{position:absolute;left:7%;bottom:16%;color:var(--whitewash)}
.t-title b{display:block;font-family:var(--display);font-size:30px;font-weight:300;line-height:1}
.t-title i{display:block;font-style:normal;font-size:9px;margin-top:5px;opacity:.85}
.eyeb{font-size:6px;letter-spacing:.2em;text-transform:uppercase;color:var(--sea-myrtos)}
.pad{position:absolute;inset:11% 7%}
.hd{font-family:var(--display);font-size:19px;color:var(--ink);line-height:1.05;margin:4px 0 0}
.hd--dark{color:var(--whitewash)}
.bar{height:2px;background:var(--sand);margin-top:7px;width:34%}
.row{display:flex;gap:5px;margin-top:9px}
.box{flex:1;border-radius:4px;background:var(--limestone);border:1px solid rgba(18,48,59,.08)}
.box--photo{background:linear-gradient(180deg,#7FE4E4,#0C6C90)}
.box--warm{background:linear-gradient(180deg,#EDA85E,#9A5F6E)}
.num{position:absolute;left:6%;bottom:14%;font-family:var(--display);font-size:52px;line-height:.8;color:var(--sun)}
.chap{position:absolute;left:22%;bottom:15%;color:var(--whitewash)}
.chap b{display:block;font-family:var(--display);font-size:24px;font-weight:300;line-height:1}
.chap i{display:block;font-family:var(--script);font-style:normal;font-size:12px;color:var(--sun-glow);margin-top:2px}
.arches{position:absolute;inset:24% 8% 14%;display:flex;gap:7px}
.arch{flex:1;border-radius:50% 50% 0 0/42% 42% 0 0;border:2px solid var(--whitewash);
  background:linear-gradient(180deg,#A9E4F2,#54C9D4 46%,#0D6486);box-shadow:0 4px 10px rgba(18,48,59,.2)}
.wipe{position:absolute;inset:0}
.wipe__handle{position:absolute;top:0;bottom:0;left:52%;width:2px;background:var(--whitewash)}
.wipe__knob{position:absolute;top:50%;left:52%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:var(--whitewash);box-shadow:0 3px 8px rgba(18,48,59,.3)}
.stops{position:absolute;inset:34% 7% 12%;display:flex;gap:6px}
.stop{flex:1;border-radius:5px;background:rgba(253,251,246,.16);border:1px solid rgba(253,251,246,.3)}
.wave{position:absolute;left:7%;right:7%;top:30%;height:1px;background:var(--sea-myrtos);opacity:.8}
.boat{position:absolute;right:16%;top:26%;font-size:11px}
.stats{position:absolute;inset:30% 7% 18%;display:flex;gap:8px;text-align:center}
.stat{flex:1}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:300;color:var(--whitewash);line-height:1}
.stat i{display:block;font-style:normal;font-size:6px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea-myrtos);margin-top:3px}
.cards{position:absolute;inset:26% 7% 12%;display:flex;gap:6px}
.card{flex:1;border-radius:5px;background:var(--whitewash);border:1px solid rgba(18,48,59,.1);
  box-shadow:0 4px 10px rgba(18,48,59,.1);overflow:hidden;display:flex;flex-direction:column}
.card__img{height:38%;background:linear-gradient(180deg,#A5E1F0,#5CC9D2 52%,#0A5570)}
.card__body{flex:1;padding:5px 6px}
.card__t{font-family:var(--display);font-size:11px;color:var(--ink);line-height:1}
.card__l{height:1px;background:var(--sand);margin-top:5px}
.card__o{font-size:6px;color:var(--mavrodaphne);margin-top:4px}
.lines{position:absolute;inset:30% 7% 14%;display:grid;gap:4px}
.line{border-radius:4px;background:var(--whitewash);border:1px solid var(--sand);
  display:grid;grid-template-columns:34% 26% 1fr;align-items:center;gap:6px;padding:0 7px}
.line span{height:5px;border-radius:3px;background:var(--limestone)}
.line span:first-child{background:var(--sea-foam)}
.duel{position:absolute;inset:32% 7% 12%;display:grid;gap:3px}
.duel__r{display:grid;grid-template-columns:1fr 22% 1fr;gap:6px;align-items:center;
  border-radius:4px;padding:3px 6px}
.duel__r:nth-child(odd){background:var(--limestone)}
.duel__r span{height:5px;border-radius:3px;background:rgba(18,48,59,.12)}
.duel__r span.w{background:var(--sun)}
.quiz{position:absolute;inset:28% 7% 14%;display:flex;gap:6px}
.q{flex:1;border-radius:5px;border:1px solid rgba(253,251,246,.3);overflow:hidden;position:relative;
  background:linear-gradient(180deg,#93DDEF 26%,#84E7E4 26%,#0E7392)}
.q--sand{background:linear-gradient(180deg,#BCE2F3 26%,#4FB6D8 26%,#14567E)}
.q--right{border:2px solid var(--sun);box-shadow:0 4px 12px rgba(246,192,73,.4)}
.q i{position:absolute;left:4px;bottom:3px;font-style:normal;font-size:7px;color:var(--whitewash)}
.centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:5px;padding:0 14%}
.centre b{font-family:var(--display);font-size:17px;font-weight:300;font-style:italic;color:var(--ink);line-height:1.15}
.closing b{font-family:var(--display);font-size:30px;font-weight:300;color:var(--whitewash);line-height:1}
.closing__sun{position:absolute;left:50%;bottom:-9%;width:26%;aspect-ratio:1;margin-left:-13%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,243,214,.9),rgba(255,226,154,0) 70%)}
.rail{position:absolute;left:7%;right:7%;bottom:7%;display:flex;gap:3px;align-items:center}
.rail i{flex:1;height:1.5px;background:rgba(18,48,59,.14);border-radius:2px}
.rail i.on{background:var(--sun)}
.rail--dark i{background:rgba(253,251,246,.22)}
.rail--dark i.on{background:var(--sun)}
</style>
</head>

<p class="eyebrow">Design system · slide types</p>
<h1>Fourteen ways to hold a room</h1>
<p class="lede">Every slide in the deck is one of these components, on a fixed 1920×1080 canvas with a

photograph pushes slowly for eighteen seconds.</p>

  <figure><div class="thumb" style="background:linear-gradient(160deg,#FDFBF6,#F4ECDD)">
    <div class="centre">
      <svg width="46" height="23" viewBox="0 0 96 48" aria-hidden="true">
